name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      ios:
        description: "Zusätzlich iOS bauen (macOS-Runner, ohne Signierung)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build-test-windows:
    name: Build & Test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI workload (Windows only)
        run: dotnet workload install maui-windows

      # Kein separater "dotnet restore": Die MAUI-Windows-App braucht in Release das win-x64-Runtime-Pack,
      # das nur ein Restore MIT Release-Konfiguration lädt (sonst NETSDK1112). Build restored daher selbst.
      - name: Build (Core, Infrastructure, Tests, App/Windows)
        run: dotnet build LifeDashboard.slnx -c Release

      - name: Test
        run: dotnet test LifeDashboard.slnx -c Release --no-build --logger "trx;LogFileName=results.trx" --collect "XPlat Code Coverage"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/**/TestResults/**

  build-ios:
    name: Build (iOS, optional)
    if: github.event_name == 'workflow_dispatch' && inputs.ios
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Install MAUI workload (iOS)
        run: dotnet workload install ios maui-ios

      - name: Build iOS simulator (unsigned)
        run: dotnet build src/LifeDashboard.App/LifeDashboard.App.csproj -c Debug -f net10.0-ios -p:RuntimeIdentifier=iossimulator-arm64
